<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background -->
  <rect width="200" height="200" fill="#FFD700"/>

  <!-- Diagonal slash -->
  <line x1="25" y1="175" x2="110" y2="25" stroke="#000" stroke-width="16" stroke-linecap="round"/>

  <!-- Bold F in italic -->
  <text x="55" y="150" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#000" font-style="italic" letter-spacing="-3">F</text>
</svg>