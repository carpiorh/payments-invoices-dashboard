<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background matching FLAIR photo -->
  <rect width="200" height="200" fill="#FFE135"/>

  <!-- Decorative slash -->
  <line x1="30" y1="170" x2="100" y2="20" stroke="#000000" stroke-width="14" stroke-linecap="round"/>

  <!-- Bold FLAIR F in italic to match photo -->
  <g font-family="'Arial Black', 'Helvetica', sans-serif" font-size="140" font-weight="900" fill="#000000" font-style="italic" letter-spacing="-3">
    <text x="50" y="150">F</text>
  </g>
</svg>