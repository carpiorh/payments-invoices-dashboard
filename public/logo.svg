<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background matching photo -->
  <rect width="600" height="200" fill="#FFE135"/>

  <!-- Decorative slash through F -->
  <line x1="50" y1="170" x2="120" y2="30" stroke="#000000" stroke-width="15" stroke-linecap="round"/>

  <!-- FLAIR text - exact match to photo with proper italic styling -->
  <g font-family="'Arial Black', 'Helvetica', sans-serif" font-size="130" font-weight="900" fill="#000000" font-style="italic">
    <text x="130" y="130" letter-spacing="-4">FLAIR</text>
  </g>

  <!-- INVOICE & PAYMENTS - exact match to photo -->
  <g font-family="'Arial', 'Helvetica', sans-serif" font-size="42" font-weight="900" fill="#000000" letter-spacing="1.5">
    <text x="60" y="175">INVOICE & PAYMENTS</text>
  </g>
</svg>