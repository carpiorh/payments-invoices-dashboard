<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background -->
  <rect width="520" height="200" fill="#FFD700"/>

  <!-- Decorative slash -->
  <line x1="45" y1="160" x2="110" y2="40" stroke="#000" stroke-width="14" stroke-linecap="round"/>

  <!-- FLAIR text - simplified, no transforms -->
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="#000" font-style="italic" letter-spacing="-2">FLAIR</text>

  <!-- INVOICE & PAYMENTS text -->
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#000" letter-spacing="2">INVOICE & PAYMENTS</text>
</svg>