<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background -->
  <rect width="500" height="300" fill="#FFD700"/>

  <!-- FLAIR text with italic bold styling -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
      .flair {
        font-family: 'Arial Black', 'Helvetica', sans-serif;
        font-size: 140px;
        font-weight: 900;
        fill: #000;
        font-style: italic;
        letter-spacing: -8px;
        transform: skewX(-15deg);
      }
      .subtitle {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 48px;
        font-weight: 900;
        fill: #000;
        letter-spacing: 3px;
        transform: skewX(-10deg);
      }
    </style>
  </defs>

  <!-- Decorative slash line through FLAIR -->
  <line x1="50" y1="180" x2="120" y2="80" stroke="#000" stroke-width="16" stroke-linecap="round"/>

  <!-- FLAIR main text -->
  <g transform="translate(80, 180)">
    <text x="0" y="0" class="flair">FLAIR</text>
  </g>

  <!-- INVOICE & PAYMENTS subtitle -->
  <g transform="translate(50, 240)">
    <text x="0" y="0" class="subtitle">INVOICE & PAYMENTS</text>
  </g>
</svg>